<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear Testimonio | Admin Ecuador</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>

<body>

<div class="admin-news-layout">

    <aside class="admin-news-sidebar">

        <div>
            <div class="admin-news-logo">
                <h2>Ecuador Comparte</h2>
                <p>Gestión de Impacto Nacional</p>
            </div>

            <nav class="admin-news-menu">

                <a th:href="@{/admin}">
                    <i class="bi bi-grid-fill"></i>
                    Dashboard
                </a>

                <a th:href="@{/contact-request}">
                    <i class="bi bi-envelope-paper-fill"></i>
                    Contacto
                </a>

                <a th:href="@{/news}">
                    <i class="bi bi-newspaper"></i>
                    Noticias
                </a>

                <a th:href="@{/testimonials}" class="active">
                    <i class="bi bi-chat-square-quote-fill"></i>
                    Testimonios
                </a>

            </nav>
        </div>

        <div class="admin-news-bottom">

            <a th:href="@{/testimonials}"
               class="admin-news-report-btn">
                <i class="bi bi-arrow-left"></i>
                Volver
            </a>

            <a th:href="@{/logout}"
               class="admin-news-logout">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar Sesión
            </a>

        </div>

    </aside>

    <main class="admin-news-main">

        <div class="admin-news-header">

            <div>
                <h1>Crear Testimonio</h1>
                <p>Agrega una persona o historia destacada de Ecuador Comparte.</p>
            </div>

        </div>

        <section class="admin-create-card">

            <form th:action="@{/testimonials}"
                  th:object="${testimonialRequest}"
                  method="post"
                  class="admin-create-form">

                <div class="admin-create-grid">

                    <div class="admin-form-group full">
                        <label>Nombre</label>

                        <input type="text"
                               th:field="*{name}"
                               placeholder="Nombre de la persona"
                               required>
                    </div>

                    <div class="admin-form-group full">
                        <label>URL Foto</label>

                        <input type="text"
                               th:field="*{photoUrl}"
                               placeholder="/images/testimonial1.jpg">
                    </div>

                    <div class="admin-form-group">
                        <label>Instagram</label>

                        <input type="text"
                               th:field="*{instagramUrl}"
                               placeholder="https://instagram.com/usuario">
                    </div>

                    <div class="admin-form-group">
                        <label>Facebook</label>

                        <input type="text"
                               th:field="*{facebookUrl}"
                               placeholder="https://facebook.com/usuario">
                    </div>

                </div>

                <div class="admin-form-actions">

                    <a th:href="@{/testimonials}"
                       class="admin-cancel-btn">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="admin-save-btn">
                        <i class="bi bi-check-circle"></i>
                        Guardar Testimonio
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
