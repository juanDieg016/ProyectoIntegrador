<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Noticia | Admin Ecuador</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>

<body>

<div class="admin-news-layout">

    <aside class="admin-news-sidebar">

        <div>
            <div class="admin-news-logo">
                <h2>Ecuador Comparte</h2>
                <p>Gestión de Impacto Nacional</p>
            </div>

            <nav class="admin-news-menu">

                <a th:href="@{/admin}">
                    <i class="bi bi-grid-fill"></i>
                    Dashboard
                </a>

                <a th:href="@{/news}" class="active">
                    <i class="bi bi-newspaper"></i>
                    Noticias
                </a>

                <a th:href="@{/testimonials}">
                    <i class="bi bi-chat-square-quote-fill"></i>
                    Testimonios
                </a>
                <a th:href="@{/contact-request}">
                    <i class="bi bi-bar-chart-fill"></i>
                    Contacto
                </a>



            </nav>
        </div>

        <div class="admin-news-bottom">

            <a th:href="@{/news}" class="admin-news-report-btn">
                <i class="bi bi-arrow-left"></i>
                Volver a noticias
            </a>

            <a th:href="@{/logout}" class="admin-news-logout">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar Sesión
            </a>

        </div>

    </aside>

    <main class="admin-news-main">

        <div class="admin-news-header">

            <div>
                <h1>Crear Noticia</h1>
                <p>Registra una nueva noticia de impacto para Ecuador Comparte.</p>
            </div>

            <a th:href="@{/news}" class="admin-news-create-btn">
                <i class="bi bi-list"></i>
                Ver Noticias
            </a>

        </div>

        <section class="admin-create-card">

            <form th:action="@{/news}"
                  th:object="${newsRequest}"
                  method="post"
                  class="admin-create-form">

                <div class="admin-create-grid">

                    <div class="admin-form-group full">

                        <label>Título</label>

                        <input type="text"
                               th:field="*{title}"
                               placeholder="Título de la noticia"
                               required>

                    </div>

                    <div class="admin-form-group full">

                        <label>Resumen</label>

                        <textarea th:field="*{summary}"
                                  rows="3"
                                  placeholder="Resumen corto"></textarea>

                    </div>

                    <div class="admin-form-group full">

                        <label>Contenido</label>

                        <textarea th:field="*{content}"
                                  rows="8"
                                  placeholder="Contenido completo"></textarea>

                    </div>

                    <div class="admin-form-group">

                        <label>URL Imagen</label>

                        <input type="text"
                               th:field="*{imageUrl}"
                               placeholder="/images/news1.jpg">

                    </div>

                    <div class="admin-form-group">

                        <label>Autor</label>

                        <input type="text"
                               th:field="*{author}"
                               placeholder="Equipo Ecuador Comparte">

                    </div>

                    <div class="admin-form-group">

                        <label>Fecha publicación</label>

                        <input type="datetime-local"
                               th:field="*{publicationDate}">

                    </div>

                    <div class="admin-form-group">

                        <label>Estado</label>

                        <select th:field="*{state}">

                            <option
                                    th:each="estado : ${estados}"
                                    th:value="${estado}"
                                    th:text="${estado.visualName}">
                            </option>

                        </select>

                    </div>

                </div>

                <div class="admin-form-actions">

                    <a th:href="@{/news}"
                       class="admin-cancel-btn">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="admin-save-btn">

                        <i class="bi bi-check-circle"></i>

                        Guardar Noticia

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
