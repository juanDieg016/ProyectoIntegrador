<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Solicitud | Admin</title>

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/logo.png}">

</head>

<body>

<div class="delete-news-page">

    <div class="delete-news-card">

        <div class="delete-news-icon">

            <i class="bi bi-trash3-fill"></i>

        </div>

        <h1>
            Eliminar Solicitud
        </h1>

        <p>
            ¿Estás seguro de eliminar esta solicitud de contacto?
            Esta acción no se puede deshacer.
        </p>

        <div class="delete-news-preview">

            <h3 th:text="${contact.name}">
                Usuario
            </h3>

            <span th:text="${contact.email}">
                correo@email.com
            </span>

        </div>

        <form th:action="@{'/contact-request/delete/' + ${contact.id}}"
              method="post">



            <div class="delete-news-actions">

                <a th:href="@{/contact-request}"
                   class="delete-cancel-btn">

                    Cancelar

                </a>

                <button type="submit"
                        class="delete-confirm-btn">

                    <i class="bi bi-trash"></i>

                    Eliminar

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
